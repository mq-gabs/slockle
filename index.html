<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Crack today's three hidden unlock patterns in six tries each.">
  <title>Daily Pattern Lock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-actions">
      <button class="icon-btn" id="help-btn" data-i18n-aria="aria.help">?</button>
      <select class="lang-select" id="lang" data-i18n-aria="aria.lang"></select>
    </div>
    <h1>Pattern Lock <span id="puzzle-no"></span></h1>
    <div class="top-actions">
      <button class="icon-btn" id="archive-btn" data-i18n-aria="aria.archive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2" /><path d="M4 10h16M9 3v4M15 3v4" /></svg>
      </button>
      <button class="icon-btn" id="stats-btn" data-i18n-aria="aria.stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6" /></svg>
      </button>
    </div>
  </header>

  <div class="archive-banner" id="archive-banner" hidden>
    <span><span data-i18n="banner.past"></span> · <strong id="archive-banner-date"></strong></span>
    <a id="archive-banner-today" data-i18n="banner.today"></a>
  </div>

  <nav class="locks" id="locks" data-i18n-aria="aria.locks"></nav>

  <main id="play">
    <div class="status">
      <span id="lock-info"></span>
      <span id="attempts"></span>
    </div>

    <div class="board">
      <svg id="grid" class="grid" viewBox="0 0 100 100" role="img" data-i18n-aria="aria.grid"></svg>
      <div class="thumbs" id="thumbs" data-i18n-aria="aria.thumbs"></div>
    </div>

    <ul class="legend" data-i18n-aria="aria.legend">
      <li><span class="key key-g"></span><span data-i18n="legend.g"></span></li>
      <li><span class="key key-y"></span><span data-i18n="legend.y"></span></li>
      <li><span class="key key-x"></span><span data-i18n="legend.x"></span></li>
    </ul>

    <p class="msg" id="msg" aria-live="polite"></p>

    <div class="lock-end" id="lock-end" hidden>
      <button class="primary" id="next-btn"></button>
    </div>

    <section class="hints">
      <h2 data-i18n="play.hints"></h2>
      <ol id="hints"></ol>
    </section>
  </main>

  <main id="result" hidden>
    <h2 class="result-title" id="result-title"></h2>
    <div class="result-locks" id="result-locks"></div>
    <button class="primary" id="share-btn" data-i18n="result.share"></button>
    <p class="countdown" id="countdown-row"><span data-i18n="result.next"></span> <strong id="countdown"></strong></p>
    <p class="fine" id="archive-actions" data-i18n="result.archiveNote" hidden></p>
    <div class="result-actions">
      <button class="secondary" id="result-archive-btn" data-i18n="result.archive"></button>
      <button class="secondary" id="result-stats-btn" data-i18n="result.stats"></button>
    </div>
    <p><a class="today-link" id="result-today-btn" data-i18n="result.today"></a></p>
  </main>

  <dialog id="help">
    <form method="dialog"><button class="close" data-i18n-aria="aria.close">×</button></form>
    <h2 data-i18n="help.title"></h2>
    <p data-i18n-html="help.intro"></p>
    <ul>
      <li data-i18n="help.rule1"></li>
      <li data-i18n="help.rule2"></li>
      <li data-i18n="help.rule3"></li>
      <li data-i18n="help.rule4"></li>
    </ul>
    <h3 data-i18n="help.exampleTitle"></h3>
    <p data-i18n="help.example"></p>
    <div class="example">
      <svg id="example-grid" class="grid small-grid" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <ul class="legend legend-col">
        <li><span class="key key-g"></span><span data-i18n="help.exG"></span></li>
        <li><span class="key key-y"></span><span data-i18n="help.exY"></span></li>
        <li><span class="key key-x"></span><span data-i18n="help.exX"></span></li>
      </ul>
    </div>
    <p class="fine" data-i18n="help.fine"></p>
    <form method="dialog"><button class="primary" data-i18n="help.play"></button></form>
  </dialog>

  <dialog id="stats">
    <form method="dialog"><button class="close" data-i18n-aria="aria.close">×</button></form>
    <h2 data-i18n="stats.title"></h2>
    <div class="stat-row" id="stat-row"></div>
    <h3 data-i18n="stats.dist"></h3>
    <div class="dist" id="dist"></div>
  </dialog>

  <dialog id="archive">
    <form method="dialog"><button class="close" data-i18n-aria="aria.close">×</button></form>
    <h2 data-i18n="archive.title"></h2>
    <p class="fine" data-i18n="archive.note"></p>
    <label class="archive-pick"><span data-i18n="archive.pick"></span> <input type="date" id="archive-date"></label>
    <div class="archive-list" id="archive-list"></div>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="i18n.js"></script>
  <script src="logic.js"></script>
  <script src="game.js"></script>
</body>
</html>
